---
# - name: NGINX
#   import_tasks: nginx.yml

- name: Copy NGINX files
  ansible.builtin.copy:
    src: ./
    dest: /opt/cloud-1/nginx/
    owner: ubuntu
    group: ubuntu
    mode: '0644'

- name: Build and start nginx
  community.docker.docker_compose_v2:
    project_src: /opt/cloud-1
    services:
      - nginx
    build: always
    state: present